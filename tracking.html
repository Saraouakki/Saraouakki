<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suivre ma commande — Om Ritaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="omr-nav">
  <div class="max-w-6xl mx-auto flex items-center justify-between px-5 py-4">
    <a href="index.html" class="omr-logo text-2xl"><span class="accent-o">Om</span> Ritaj</a>
    <a href="index.html#products" class="btn-omr !py-2 !px-4 text-xs">Commander</a>
  </div>
</header>

<section class="px-5 py-14 md:py-20 max-w-2xl mx-auto">
  <h1 class="omr-logo text-3xl md:text-4xl text-center mb-8">Suivre ma commande</h1>

  <div class="checkout-card p-6 md:p-8 mb-8">
    <label class="block text-xs uppercase tracking-wide font-semibold mb-2 opacity-70">Numéro de commande</label>
    <div class="flex gap-3">
      <input type="text" id="order-id-input" class="omr-input" placeholder="ex. OMR-20260719-XXXX">
      <button id="track-btn" class="btn-omr !px-5 whitespace-nowrap">Suivre</button>
    </div>
  </div>

  <div id="tracking-result" class="checkout-card p-6 md:p-8 hidden">
    <div class="flex items-center justify-between mb-6">
      <div>
        <p class="omr-logo text-xl" id="result-order-id"></p>
        <p class="text-sm opacity-70" id="result-product"></p>
      </div>
      <span class="badge-omr" id="result-status"></span>
    </div>
    <div id="tracking-steps"></div>
  </div>

  <p id="tracking-empty" class="text-center opacity-60 text-sm hidden">Aucune commande trouvée avec ce numéro. Veuillez vérifier et réessayer.</p>
</section>

<footer class="px-5 py-10" style="background: var(--omr-cream-dark);">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
    <span class="omr-logo text-xl"><span class="accent-o">Om</span> Ritaj</span>
    <p class="text-xs opacity-70">© 2026 Om Ritaj. Tous droits réservés.</p>
    <a href="https://www.instagram.com/omritaj28" target="_blank" rel="noopener" class="text-xs underline opacity-80">@omritaj28</a>
  </div>
</footer>

<script>
const STEPS = ["Commande confirmée", "En préparation", "Remise au livreur", "En cours de livraison", "Livrée"];

async function trackOrder(orderId) {
  const resultBox = document.getElementById("tracking-result");
  const emptyBox = document.getElementById("tracking-empty");
  resultBox.classList.add("hidden");
  emptyBox.classList.add("hidden");

  try {
    const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/tracking`);
    if (!res.ok) throw new Error("not found");
    const data = await res.json();

    document.getElementById("result-order-id").textContent = data.orderId;
    document.getElementById("result-product").textContent = `${data.productName} · ${data.variant}`;
    document.getElementById("result-status").textContent = data.currentStatus;

    const currentIndex = STEPS.indexOf(data.currentStatus);
    const stepsHtml = STEPS.map((step, idx) => {
      const done = idx <= currentIndex;
      const isLast = idx === STEPS.length - 1;
      return `
        <div class="tracking-step ${done ? "done" : ""}">
          <div class="flex flex-col items-center">
            <div class="node">${done ? "✓" : idx + 1}</div>
            ${!isLast ? '<div class="connector"></div>' : ""}
          </div>
          <div class="pb-8">
            <p class="font-medium text-sm">${step}</p>
            ${data.history && data.history[step] ? `<p class="text-xs opacity-60">${new Date(data.history[step]).toLocaleString()}</p>` : ""}
          </div>
        </div>
      `;
    }).join("");

    document.getElementById("tracking-steps").innerHTML = stepsHtml;
    resultBox.classList.remove("hidden");
  } catch (err) {
    emptyBox.classList.remove("hidden");
  }
}

document.getElementById("track-btn").addEventListener("click", () => {
  const id = document.getElementById("order-id-input").value.trim();
  if (id) trackOrder(id);
});

document.getElementById("order-id-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("track-btn").click();
});

const params = new URLSearchParams(window.location.search);
const prefillId = params.get("order");
if (prefillId) {
  document.getElementById("order-id-input").value = prefillId;
  trackOrder(prefillId);
}
</script>
</body>
</html>
